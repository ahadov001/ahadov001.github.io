<!DOCTYPE html>
<html lang="az">
<head>
<title>Şəxsi kabinet — Azərbaycan dili</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-head"></header>
<main class="wrap">
<div id="setup-banner"></div>
<div class="kab-head"><div><p class="eyebrow" style="margin:0 0 6px">Şəxsi kabinet</p><h1 id="who">…</h1><div class="email" id="mail"></div></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div class="chip bal" style="font-size:1rem;padding:9px 16px" id="balbox">…</div><a class="btn solid" href="balans.html">Balansı artır</a></div></div>

<div class="ktabs" role="tablist" id="ktabs">
<button type="button" role="tab" data-tab="umumi" aria-selected="true">Ümumi</button>
<button type="button" role="tab" data-tab="movzular" aria-selected="false">Mövzularım</button>
<button type="button" role="tab" data-tab="transkript" aria-selected="false">Transkript</button>
<button type="button" role="tab" data-tab="emeliyyatlar" aria-selected="false">Əməliyyatlar</button>
<button type="button" role="tab" data-tab="profil" aria-selected="false">Profil</button>
</div>

<div class="kpanel" id="p-umumi"><p class="empty">Yüklənir…</p></div>
<div class="kpanel" id="p-movzular" hidden></div>
<div class="kpanel" id="p-trans" hidden></div>
<div class="kpanel" id="p-emeliyyatlar" hidden></div>
<div class="kpanel" id="p-profil" hidden></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>

(async function () {
  var S = window.Sinaq, esc = S.esc, sb = S.sb;
  S.mountHeader("kabinet");
  S.setupBanner();
  if (!(await S.requireLogin())) return;
  var user = S.state.user;

  var r = await Promise.all([
    sb.from("items").select("*").order("sort"),
    sb.from("purchases").select("item_id,price,created_at"),
    sb.from("item_progress").select("item_id,status,last_opened_at"),
    sb.from("attempts").select("id,item_id,score,total,duration_sec,created_at").order("created_at", { ascending: false }).limit(1000),
    sb.from("transactions").select("amount,kind,note,balance_after,created_at").order("created_at", { ascending: false }).limit(200),
    S.loadProfile()
  ]);
  var failed = r.slice(0, 5).some(function (x) { return x.error; });
  if (failed) { document.getElementById("p-umumi").innerHTML = '<p class="empty">Məlumat yüklənmədi. Səhifəni yenilə.</p>'; return; }

  var items = r[0].data || [], purchases = r[1].data || [], progress = r[2].data || [], attempts = r[3].data || [], tx = r[4].data || [];
  var byId = {}; items.forEach(function (i) { byId[i.id] = i; });
  var bundle = items.filter(function (i) { return i.kind === "bundle"; })[0];
  var boughtIds = {}; purchases.forEach(function (p) { boughtIds[p.item_id] = true; });
  var hasBundle = !!(bundle && boughtIds[bundle.id]);
  var content = items.filter(function (i) { return i.kind !== "bundle"; });
  function open(i) { return Number(i.price) === 0 || hasBundle || !!boughtIds[i.id]; }

  var prog = {}; progress.forEach(function (p) { prog[p.item_id] = p; });
  var stat = {};  // item_id -> {n, best, last}
  attempts.forEach(function (a) {
    var s = stat[a.item_id] || (stat[a.item_id] = { n: 0, best: 0, last: null });
    var p = S.pct(a.score, a.total);
    s.n++; if (p > s.best) s.best = p; if (!s.last) s.last = a;   // attempts yeni → köhnə
  });
  function status(i) {
    if (!open(i)) return "lock";
    if (stat[i.id]) return "done";
    if (prog[i.id]) return "start";
    return "new";
  }

  /* ---------- başlıq ---------- */
  var name = (S.state.profile && S.state.profile.full_name) || user.email.split("@")[0];
  document.getElementById("who").textContent = name;
  document.getElementById("mail").textContent = user.email;
  document.getElementById("balbox").textContent = S.money(S.state.profile.balance);

  /* ---------- Ümumi ---------- */
  var openItems = content.filter(open);
  var doneItems = openItems.filter(function (i) { return stat[i.id]; });
  var avg = attempts.length ? Math.round(attempts.reduce(function (a, x) { return a + S.pct(x.score, x.total); }, 0) / attempts.length) : 0;
  var best = attempts.reduce(function (m, x) { return Math.max(m, S.pct(x.score, x.total)); }, 0);
  var toLook = openItems.filter(function (i) { return status(i) === "new"; });
  var ongoing = openItems.filter(function (i) { return status(i) === "start"; });

  function chart() {
    var pts = attempts.slice(0, 30).reverse();
    if (pts.length < 2) return '<p class="empty">İnkişaf qrafiki üçün ən azı iki test həll et.</p>';
    var W = 640, H = 230, L = 46, R = 14, T = 12, B = 30, w = W - L - R, h = H - T - B;
    var x = function (k) { return L + (pts.length === 1 ? w / 2 : (k / (pts.length - 1)) * w); };
    var y = function (v) { return T + h - (v / 100) * h; };
    var grid = [0, 50, 100].map(function (v) { return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + "%</text>"; }).join("");
    var line = pts.map(function (a, k) { return x(k).toFixed(1) + "," + y(S.pct(a.score, a.total)).toFixed(1); }).join(" ");
    var dots = pts.map(function (a, k) {
      var it = byId[a.item_id], p = S.pct(a.score, a.total);
      return '<circle class="dot" cx="' + x(k).toFixed(1) + '" cy="' + y(p).toFixed(1) + '" r="4"><title>' + esc((it ? it.title : "Test") + " — " + p + "% (" + S.fmtDate(a.created_at) + ")") + "</title></circle>";
    }).join("");
    var first = S.fmtDate(pts[0].created_at), last = S.fmtDate(pts[pts.length - 1].created_at);
    var desc = "Son " + pts.length + " testin nəticəsi, faizlə. İlk nəticə " + S.pct(pts[0].score, pts[0].total) + "%, son nəticə " + S.pct(pts[pts.length - 1].score, pts[pts.length - 1].total) + "%.";
    return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(desc) + '"><g class="grid">' + grid + '</g><polyline class="ln" points="' + line + '"/>' + dots +
      '<text x="' + L + '" y="' + (H - 8) + '">' + first + '</text><text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">' + last + "</text></svg>";
  }
  function trend() {
    if (attempts.length < 4) return "";
    var recent = attempts.slice(0, 5), prev = attempts.slice(5, 10);
    var a = function (arr) { return arr.reduce(function (s, x) { return s + S.pct(x.score, x.total); }, 0) / arr.length; };
    if (!prev.length) return "";
    var d = Math.round(a(recent) - a(prev));
    if (Math.abs(d) < 2) return "Son nəticələrin əvvəlkilərlə təxminən eynidir.";
    return d > 0 ? "Son " + recent.length + " testin ortası əvvəlkindən " + d + " bənd yüksəkdir. İrəliləyirsən." : "Son " + recent.length + " testin ortası əvvəlkindən " + Math.abs(d) + " bənd aşağıdır. Zəif mövzuları təkrar et.";
  }
  function bars() {
    var rows = content.filter(function (i) { return stat[i.id]; }).sort(function (a, b) { return stat[a.id].best - stat[b.id].best; });
    if (!rows.length) return '<p class="empty">Hələ həll olunmuş test yoxdur.</p>';
    return '<div class="bars">' + rows.map(function (i) {
      var b = stat[i.id].best, c = b >= 80 ? "" : b >= 50 ? "mid" : "low";
      return '<div class="bar"><div class="t">' + esc(i.title) + '</div><div class="tr"><div class="fl ' + c + '" style="width:' + b + '%"></div></div><div class="v">' + b + "%</div></div>";
    }).join("") + "</div>";
  }
  function nextSteps() {
    var li = [];
    ongoing.slice(0, 3).forEach(function (i) { li.push('<a href="test.html?i=' + encodeURIComponent(i.slug) + '">' + esc(i.title) + "</a> — başlamısan, bitir"); });
    toLook.slice(0, 3 - Math.min(ongoing.length, 3) + 2).forEach(function (i) { li.push('<a href="test.html?i=' + encodeURIComponent(i.slug) + '">' + esc(i.title) + "</a> — hələ baxmamısan"); });
    var weak = doneItems.filter(function (i) { return stat[i.id].best < 60; }).slice(0, 2);
    weak.forEach(function (i) { li.push('<a href="test.html?i=' + encodeURIComponent(i.slug) + '">' + esc(i.title) + "</a> — ən yaxşı nəticən " + stat[i.id].best + "%, təkrar et"); });
    return li.length ? "<ul>" + li.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>" : '<p class="empty">Açıq məzmunun hamısını bitirmisən. Yeni test almaq üçün <a href="index.html">siyahıya</a> bax.</p>';
  }

  document.getElementById("p-umumi").innerHTML =
    '<div class="tiles"><div class="tile"><b>' + attempts.length + "</b><span>həll olunan test</span></div>" +
    '<div class="tile"><b>' + (attempts.length ? avg + "%" : "—") + "</b><span>orta nəticə</span></div>" +
    '<div class="tile"><b>' + (attempts.length ? best + "%" : "—") + "</b><span>ən yaxşı nəticə</span></div>" +
    '<div class="tile"><b>' + doneItems.length + " / " + openItems.length + "</b><span>açıq testdən bitirilən</span></div></div>" +
    '<div class="box"><h2>İnkişaf</h2><p class="hint">' + esc(trend() || "Son testlərin nəticəsi (faizlə).") + "</p>" + chart() + "</div>" +
    '<div class="box"><h2>Növbəti addımlar</h2><p class="hint">Nəyə baxmaq və nəyi təkrar etmək lazımdır.</p>' + nextSteps() + "</div>" +
    '<div class="box"><h2>Mövzular üzrə ən yaxşı nəticə</h2><p class="hint">Ən zəifdən başlayaraq.</p>' + bars() + "</div>";

  /* ---------- Mövzularım ---------- */
  var GROUPS = [
    ["Mövzular", function (i) { return i.kind === "topic"; }],
    ["Buraxılış imtahanı", function (i) { return i.kind === "exam" && /^burax/.test(i.slug); }],
    ["Qəbul imtahanı", function (i) { return i.kind === "exam" && /^qebul/.test(i.slug); }],
    ["Qarışıq testlər", function (i) { return i.kind === "mixed"; }]
  ];
  var PILL = { done: ["st-done", "Həll olunub"], start: ["st-start", "Başlanıb"], new: ["st-new", "Baxılmayıb"], lock: ["st-lock", "Kilidli"] };
  var FILT = [["all", "Hamısı"], ["new", "Baxılmayanlar"], ["start", "Davam edənlər"], ["done", "Həll olunanlar"], ["lock", "Kilidli"]];
  var cur = "all";

  function rowHtml(i) {
    var st = status(i), p = PILL[st], s = stat[i.id], meta = "";
    if (s) meta = '<div class="meta2">Ən yaxşı: ' + s.best + "% · son: " + S.pct(s.last.score, s.last.total) + "% · " + s.n + " cəhd · " + S.fmtDate(s.last.created_at) + "</div>";
    else if (st === "lock") meta = '<div class="meta2">' + esc(S.money(i.price)) + " — balansdan alınır</div>";
    var btn = st === "lock"
      ? '<button type="button" class="btn sm solid" data-buy="' + esc(i.slug) + '">Al</button>'
      : '<a class="btn sm" href="test.html?i=' + encodeURIComponent(i.slug) + '">' + (st === "done" ? "Yenidən həll et" : st === "start" ? "Davam et" : "Aç →") + "</a>";
    return '<div class="row" data-st="' + st + '"><div class="no"></div><div><div class="ttl">' + esc(i.title) + '</div><div class="sub">' + esc(i.subtitle || "") + " · " + i.question_count + " sual</div>" + meta + '</div><div class="side"><span class="pill ' + p[0] + '">' + p[1] + "</span>" + btn + "</div></div>";
  }
  function renderList() {
    var html = "";
    GROUPS.forEach(function (g) {
      var rows = content.filter(g[1]).filter(function (i) { return cur === "all" || status(i) === cur; });
      if (rows.length) html += '<div class="grp">' + g[0] + '</div><div class="syl">' + rows.map(rowHtml).join("") + "</div>";
    });
    document.getElementById("mv-list").innerHTML = html || '<p class="empty">Bu filtrə uyğun məzmun yoxdur.</p>';
  }
  var cnt = function (k) { return k === "all" ? content.length : content.filter(function (i) { return status(i) === k; }).length; };
  document.getElementById("p-movzular").innerHTML =
    '<div class="box"><h2>Mövzularım</h2><p class="hint">Açıq olan testlərin vəziyyəti. Kilidli testlər balansdan alınır.' + (hasBundle ? " Tam paketin var: hamısı açıqdır." : "") + '</p><div class="filters" id="filters">' +
    FILT.map(function (f) { return '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (f[0] === "all") + '">' + f[1] + " (" + cnt(f[0]) + ")</button>"; }).join("") + '</div><div id="mv-list"></div></div>';
  renderList();
  document.getElementById("filters").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-f]"); if (!b) return;
    cur = b.getAttribute("data-f");
    document.querySelectorAll("#filters button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    renderList();
  });

  /* ---------- Transkript ---------- */
  function dur(sec) { if (!sec) return "—"; var m = Math.floor(sec / 60), s = sec % 60; return m + ":" + (s < 10 ? "0" : "") + s; }
  var trRows = attempts.map(function (a, k) {
    var it = byId[a.item_id], p = S.pct(a.score, a.total);
    return "<tr><td>" + (attempts.length - k) + "</td><td>" + S.fmtDate(a.created_at, true) + "</td><td>" + esc(it ? it.title : "—") + '</td><td class="num">' + a.score + " / " + a.total + '</td><td class="num">' + p + "%</td><td>" + esc(S.grade(p)) + '</td><td class="num">' + dur(a.duration_sec) + "</td></tr>";
  }).join("");
  var sumRows = content.filter(function (i) { return stat[i.id]; }).map(function (i) {
    var s = stat[i.id];
    return "<tr><td>" + esc(i.title) + '</td><td class="num">' + s.n + '</td><td class="num">' + s.best + '%</td><td class="num">' + S.pct(s.last.score, s.last.total) + "%</td><td>" + esc(S.grade(s.best)) + "</td></tr>";
  }).join("");
  document.getElementById("p-trans").innerHTML =
    '<div class="box"><div class="trans-head"><h2 style="font-size:1.5rem">Akademik transkript</h2><div><b>' + esc(name) + "</b> · " + esc(user.email) + "<br>Tarix: " + S.fmtDate(new Date().toISOString()) + " · Azərbaycan dili testləri</div></div>" +
    '<div class="noprint" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:6px"><div><h2>Transkript</h2><p class="hint" style="margin:0">Bütün həll etdiyin testlərin nəticəsi. Çap edib PDF kimi saxlaya bilərsən.</p></div>' + (attempts.length ? '<button type="button" class="btn sm solid" id="print">Çap et / PDF</button>' : "") + "</div>" +
    (attempts.length
      ? '<h3 style="margin:18px 0 8px;font-size:1rem">Mövzular üzrə yekun</h3><div class="tscroll2"><table class="tbl"><thead><tr><th>Test</th><th class="num">Cəhd</th><th class="num">Ən yaxşı</th><th class="num">Son</th><th>Qiymət</th></tr></thead><tbody>' + sumRows + "</tbody></table></div>" +
        '<h3 style="margin:24px 0 8px;font-size:1rem">Bütün cəhdlər</h3><div class="tscroll2"><table class="tbl"><thead><tr><th>№</th><th>Tarix</th><th>Test</th><th class="num">Bal</th><th class="num">Faiz</th><th>Qiymət</th><th class="num">Vaxt</th></tr></thead><tbody>' + trRows + "</tbody></table></div>" +
        '<p class="hint" style="margin-top:14px">Qiymət: 80% və yuxarı — Əla, 50–79% — Yaxşı, 50%-dən aşağı — Təkrar lazımdır.</p>'
      : '<p class="empty">Hələ həll olunmuş test yoxdur. <a href="index.html">Test seç</a></p>') + "</div>";
  var pr = document.getElementById("print");
  if (pr) pr.onclick = function () {
    document.body.classList.add("pt");
    var done = function () { document.body.classList.remove("pt"); window.removeEventListener("afterprint", done); };
    window.addEventListener("afterprint", done);
    window.print();
  };

  /* ---------- Əməliyyatlar ---------- */
  var KINDS = { topup: "Balans artırıldı", purchase: "Alış", refund: "Geri qaytarma", adjust: "Düzəliş" };
  document.getElementById("p-emeliyyatlar").innerHTML =
    '<div class="box"><h2>Balans əməliyyatları</h2><p class="hint">Balansın artırılması və alışlar.</p>' +
    (tx.length ? '<div class="tscroll2"><table class="tbl"><thead><tr><th>Tarix</th><th>Əməliyyat</th><th class="num">Məbləğ</th><th class="num">Balans</th></tr></thead><tbody>' + tx.map(function (t) {
      var a = Number(t.amount);
      return "<tr><td>" + S.fmtDate(t.created_at, true) + "</td><td>" + esc(KINDS[t.kind] || t.kind) + (t.kind === "purchase" && t.note ? ": " + esc(t.note) : "") + '</td><td class="num ' + (a >= 0 ? "pos" : "neg") + '">' + (a >= 0 ? "+" : "−") + esc(S.money(Math.abs(a))) + '</td><td class="num">' + esc(S.money(t.balance_after)) + "</td></tr>";
    }).join("") + "</tbody></table></div>" : '<p class="empty">Hələ əməliyyat yoxdur.</p>') + "</div>";

  /* ---------- Profil ---------- */
  document.getElementById("p-profil").innerHTML =
    '<div class="box" style="max-width:480px"><h2>Profil</h2><div id="pmsg"></div><form id="pform" novalidate><label class="field"><span>Ad, soyad</span><input type="text" name="name" maxlength="80" value="' + esc(S.state.profile.full_name || "") + '"></label>' +
    '<label class="field"><span>E-poçt</span><input type="email" value="' + esc(user.email) + '" disabled></label><button class="btn solid" type="submit">Yadda saxla</button></form>' +
    '<hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><button type="button" class="btn" id="out">Çıxış</button></div>';
  document.getElementById("pform").addEventListener("submit", async function (e) {
    e.preventDefault();
    var v = e.target.elements.name.value.trim(), pm = document.getElementById("pmsg");
    var u = await sb.from("profiles").update({ full_name: v || null }).eq("id", user.id);
    pm.className = "msg " + (u.error ? "err" : "ok");
    pm.textContent = u.error ? S.errText(u.error) : "Yadda saxlanıldı.";
    if (!u.error) { S.state.profile.full_name = v; document.getElementById("who").textContent = v || user.email.split("@")[0]; name = v || name; }
  });
  document.getElementById("out").onclick = function () { S.signOut(); };

  /* ---------- tablar ---------- */
  function showTab(t) {
    var ids = { umumi: "p-umumi", movzular: "p-movzular", transkript: "p-trans", emeliyyatlar: "p-emeliyyatlar", profil: "p-profil" };
    if (!ids[t]) t = "umumi";
    Object.keys(ids).forEach(function (k) { document.getElementById(ids[k]).hidden = k !== t; });
    document.querySelectorAll("#ktabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === t)); });
  }
  document.getElementById("ktabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-tab]"); if (!b) return;
    history.replaceState(null, "", "#" + b.getAttribute("data-tab")); showTab(b.getAttribute("data-tab"));
  });
  window.addEventListener("hashchange", function () { showTab(location.hash.slice(1)); });
  showTab(location.hash.slice(1));

  var bySlug = {}; items.forEach(function (i) { bySlug[i.slug] = i; });
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-buy]"); if (b) S.buy(bySlug[b.getAttribute("data-buy")]);
  });
})();

</script>
<footer class="site-foot"><div class="wrap">Azərbaycan dili — mövzu testləri, buraxılış və qəbul imtahanı variantları. Balans artırılarkən ödənişlər <a href="https://www.lemonsqueezy.com/">Lemon Squeezy</a> üzərindən emal olunur.</div></footer>
</body>
</html>
