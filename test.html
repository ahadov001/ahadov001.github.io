<!DOCTYPE html>
<html lang="az">
<head>
<title>Test — Azərbaycan dili</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-head"></header>
<main class="wrap narrow" id="main"><div id="setup-banner"></div><p class="empty">Yüklənir…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/quiz.js"></script>
<script>

(async function () {
  var S = window.Sinaq, esc = S.esc;
  S.mountHeader("");
  S.setupBanner();
  var main = document.getElementById("main");
  var slug = S.qs("i");
  var KIND = { topic: "Mövzu testi", exam: "İmtahan variantı", mixed: "Qarışıq test" };

  if (!slug || !/^[a-z0-9-]+$/.test(slug)) { main.innerHTML = '<p class="empty">Test seçilməyib. <a href="index.html">Siyahıya qayıt</a></p>'; return; }
  await S.ready;
  if (!S.sb) { main.innerHTML = '<p class="empty">Sayt hələ quraşdırılmayıb.</p>'; return; }
  document.title = "Test — Azərbaycan dili";

  var r = await S.sb.rpc("get_item", { p_slug: slug });

  if (r.error) {
    if (/item_not_found/.test(r.error.message)) { main.innerHTML = '<p class="empty">Belə test tapılmadı. <a href="index.html">Siyahıya qayıt</a></p>'; return; }
    if (/access_denied/.test(r.error.message)) { await locked(); return; }
    main.innerHTML = '<p class="empty">' + esc(S.errText(r.error)) + "</p>"; return;
  }
  var it = r.data;
  document.title = it.title + " — Azərbaycan dili";
  var exam = it.mode === "exam";
  var head = '<div class="hero" style="padding:34px 0 18px"><p class="eyebrow">' + esc(KIND[it.kind] || "Test") + (Number(it.price) === 0 ? " · pulsuz" : "") + '</p><h1 style="font-size:clamp(1.7rem,4vw,2.6rem)">' + esc(it.title) + '</h1><p class="lead" style="font-size:1rem;margin-top:12px">' + esc(it.subtitle || "") + "</p></div>";
  var guest = !S.state.user
    ? '<div class="notice">Daxil olmamısan, ona görə nəticən saxlanılmayacaq. <a href="giris.html?next=' + encodeURIComponent("test.html?i=" + slug) + '">Daxil ol və ya qeydiyyatdan keç</a>, nəticələrin kabinetində qalsın.</div>' : "";
  var mode = exam
    ? '<div class="notice">İmtahan rejimi: suallar bir-bir verilir, cavablar yalnız testin sonunda açılır.' + (it.minutes ? " Taymer ilk sualı açan kimi işə düşür." : "") + "</div>"
    : "";
  main.innerHTML = head + guest + mode + (it.lesson ? '<div class="lesson">' + it.lesson + "</div>" : "") +
    '<section class="plain" style="padding-top:' + (it.lesson ? "38" : "10") + 'px">' + (it.lesson ? '<h2 style="margin-bottom:6px">Mövzu testi</h2><p class="lead" style="font-size:1rem">' + it.questions.length + " sual. Cavabı seçən kimi izahı görünür.</p>" : "") + '<div id="quiz"></div></section>';

  AzQuiz.mount({
    el: "quiz", id: it.slug, uid: S.state.user ? S.state.user.id : "anon", title: it.title,
    mode: it.mode, minutes: it.minutes, questions: it.questions,
    onFinish: async function (info) {
      if (!S.state.user) return { text: "Nəticən saxlanılmadı, çünki daxil olmamısan. ", href: "giris.html?next=" + encodeURIComponent("test.html?i=" + slug), linkText: "Daxil ol" };
      var s = await S.sb.rpc("submit_attempt", { p_slug: slug, p_answers: info.answers, p_duration: info.seconds });
      if (s.error) throw s.error;
      return { text: "Nəticə kabinetdə saxlanıldı (" + s.data.score + " / " + s.data.total + "). ", href: "kabinet.html#transkript", linkText: "Transkriptə bax" };
    }
  });

  async function locked() {
    var m = await S.sb.from("items").select("slug,title,subtitle,price,kind,question_count,minutes").eq("slug", slug).maybeSingle();
    var item = m.data;
    if (!item || item.kind === "bundle") { main.innerHTML = '<p class="empty">Belə test tapılmadı. <a href="index.html">Siyahıya qayıt</a></p>'; return; }
    document.title = item.title + " — Azərbaycan dili";
    var bal = S.state.user ? Number(S.state.profile.balance) || 0 : null;
    var line = !S.state.user
      ? "Almaq üçün əvvəlcə daxil ol."
      : bal >= Number(item.price) ? "Balansın: " + S.money(bal) + ". Alışdan sonra " + S.money(bal - Number(item.price)) + " qalacaq."
      : "Balansın: " + S.money(bal) + ". Çatmayan məbləğ: " + S.money(Number(item.price) - bal) + ".";
    main.innerHTML = '<div class="hero" style="padding:34px 0 18px"><p class="eyebrow">' + esc(KIND[item.kind] || "Test") + '</p><h1 style="font-size:clamp(1.7rem,4vw,2.6rem)">' + esc(item.title) + '</h1><p class="lead" style="font-size:1rem;margin-top:12px">' + esc(item.subtitle || "") + "</p></div>" +
      '<div class="box"><h2>Bu test balansdan alınır</h2><p class="hint">' + item.question_count + " sual" + (item.minutes ? " · " + item.minutes + " dəqiqə" : "") + " · bir dəfə alırsan, həmişə açıq qalır.</p>" +
      '<p style="font-size:1.6rem;font-family:var(--display);font-weight:700;margin:0 0 6px">' + esc(S.money(item.price)) + "</p><p class=\"hint\">" + esc(line) + '</p>' +
      '<button class="btn solid" type="button" id="buy">' + (!S.state.user ? "Daxil ol və al" : bal >= Number(item.price) ? "Balansdan al" : "Balansı artır") + '</button> <a class="btn" href="index.html">Siyahıya qayıt</a></div>';
    document.getElementById("buy").onclick = function () { S.buy(item); };
  }
})();

</script>
<footer class="site-foot"><div class="wrap">Azərbaycan dili — mövzu testləri, buraxılış və qəbul imtahanı variantları. Balans artırılarkən ödənişlər <a href="https://www.lemonsqueezy.com/">Lemon Squeezy</a> üzərindən emal olunur.</div></footer>
</body>
</html>
